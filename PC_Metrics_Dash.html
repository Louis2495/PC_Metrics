<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Challenge Site Metrics</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #FFFFFF;
            text-align: center;
        }

        .metric_card {
            background-color: #272626;
            border: 1px solid rgb(66, 60, 60);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            width: 140px;
            height: 140px;
        }

        .cards_row {
            display: flex;
            gap: 20px;
            justify-content: center;
        }
        
        #login_button {
            width: 140px;
            height: 40px;
            display: block;
            margin-top: 80px;
            margin-left: auto;
            margin-right: auto;
            margin-bottom: 80px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
        }

        #google_logo {
            width: 30px;
            height: 30px;
            vertical-align: middle;
        }

        .tabs {
            display: flex;
            width: 100%;
            margin-bottom: 30px;
        }

        .tabs button {
            width: 50%;
            height: 40px;
        }

        .tabs button.selected {
            background-color: aquamarine;
        }

    </style>
</head>




<body>
    <h1>Dashboard</h1>
    <p>Stats gathered from Google Analytics</p>

    <button id = "login_button" onclick = "client.requestAccessToken();">
        <img id = "google_logo" src = "google_logo.png">
        Log In
    </button>

    <!-- https://www.w3schools.com/jsref/event_onclick.asp -->
    <div class = "tabs">
        <button id = "users_tab_button" onclick = "showUsersTab()">Users</button>
        <button id = "engagement_tab_button" onclick = "showEngagementTab()">Engagement</button>
    </div>

    
    
    <!-- __________________________________________________ USERS AND ENGAGEMENT TABS __________________________________________________ -->

    <div id = "users_tab">
        <div class = "cards_row">
            <div class = "metric_card">
                <h5>Visitors</h5>
                <p id = "activeUsers"></p>
            </div>

            <div class = "metric_card">
                <h5>Total Users</h5>
                <p id = "totalUsers"></p>
            </div>

            <div class = "metric_card">
                <h5>New Visitors</h5>
                <p id = "newUsers"></p>
            </div>
        </div>
    </div>



    <div id = "engagement_tab">
        <div class = "cards_row">
            <div class = "metric_card">
                <h5>Sessions</h5>
                <p id = "sessions"></p>
            </div>

            <div class = "metric_card">
                <h5>Page Views</h5>
                <p id = "screenPageViews"></p>
            </div>

            <div class = "metric_card">
                <h5>Avg Session Length</h5>
                <p id = "averageSessionDuration"></p>
            </div>

            <div class = "metric_card">
                <h5>Pages per Session</h5>
                <p id = "screenPageViewsPerSession"></p>
            </div>

            <div class = "metric_card">
                <h5>Engaged Sessions</h5>
                <p id = "engagedSessions"></p>
            </div>

            <div class = "metric_card">
                <h5>Engagement Rate</h5>
                <p id = "engagementRate"></p>
            </div>

            <div class = "metric_card">
                <h5>Bounce Rate</h5>
                <p id = "bounceRate"></p>
            </div>

            <div class = "metric_card">
                <h5>Engagement Duration</h5>
                <p id = "userEngagementDuration"></p>
            </div>
        </div>
    </div>


    

    <!-- __________________________________________________ LOADS GOOGLE'S JS LIBRARY __________________________________________________ -->
    <script src="https://accounts.google.com/gsi/client"></script>

    <!-- __________________________________________________ LOADS THE CHART.JS LIBRARY __________________________________________________ -->
    <!-- https://www.w3schools.com/js/js_graphics_chartjs.asp -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0"></script>

    <!-- https://developers.google.com/identity/oauth2/web/guides/use-token-model -->
    <script>
        const client = google.accounts.oauth2.initTokenClient({
            client_id: '596258053431-on8jaoq8bv24kuqqdjrqtau1u0ni59fm.apps.googleusercontent.com',
            scope: 'https://www.googleapis.com/auth/analytics.readonly',
            callback: (tokenResponse) => {
                if (tokenResponse && tokenResponse.access_token) {
                    // https://developers.google.com/analytics/devguides/reporting/data/v1/rest/v1beta/properties/runReport
                    // _____________________________________________ ALLOWS FOR SENDING THE ASK _____________________________________________
                    var xhr = new XMLHttpRequest();
                    xhr.open('POST', 'https://analyticsdata.googleapis.com/v1beta/properties/530374749:runReport');
                    xhr.setRequestHeader('Authorization', 'Bearer ' + tokenResponse.access_token);
                    // https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest/setRequestHeader
                    xhr.setRequestHeader('Content-Type', 'application/json');
                    const ask = {
                        // Correct naming and allowable metrics: https://developers.google.com/analytics/devguides/reporting/data/v1/api-schema
                        "metrics": [
                            {
                                "name": "activeUsers"
                            },

                            {
                                "name": "sessions"
                            },

                            {
                                "name": "screenPageViews"
                            },

                            {
                                "name": "averageSessionDuration"
                            },

                            {
                                "name": "newUsers"
                            },

                            {
                                "name": "screenPageViewsPerSession"
                            },

                            {
                                "name": "engagedSessions"
                            },

                            {
                                "name": "engagementRate"
                            },

                            {
                                "name": "bounceRate"
                            },

                            {
                                "name": "userEngagementDuration"
                            }
                        ],

                        "dateRanges": [
                            {
                                "startDate": "7daysAgo",
                                "endDate": "today"
                            }
                        ]
                    };

                    // _____________________________________________ ALLOWS FOR SENDING THE ASK _____________________________________________
                    var xhr2 = new XMLHttpRequest();
                    xhr2.open('POST', 'https://analyticsdata.googleapis.com/v1beta/properties/530374749:runReport');
                    xhr2.setRequestHeader('Authorization', 'Bearer ' + tokenResponse.access_token);
                    // https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequest/setRequestHeader
                    xhr2.setRequestHeader('Content-Type', 'application/json');

                    const ask2 = {
                        "metrics": [
                            {
                                "name": "totalUsers"
                            }
                        ],

                        "dimensions": [
                            {
                                "name": "browser"
                            },
                        ],

                        "dateRanges": [
                            {
                                "startDate": "7daysAgo",
                                "endDate": "today"
                            }
                        ]
                    };

                    // _________________________________________ TURNS JS OBJECT INTO JSON OBJECT _________________________________________
                    // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/stringify
                    const jsonMetrics = JSON.stringify(ask);
                    const jsonDimensions = JSON.stringify(ask2);


                    // https://developer.mozilla.org/en-US/docs/Web/API/XMLHttpRequestEventTarget/load_event
                    xhr.addEventListener("load", (event) => {
                        const response = xhr.responseText;
                        // _____________________________________ TURNS JSON OBJECT BACK INTO JS OBJECT _____________________________________
                        // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse
                        const jsMetrics = JSON.parse(response);
                        // _______________________________ ASSIGNS EACH METRIC IN THE RESPONSE TO A CONSTANT _______________________________
                        const activeUsers = jsMetrics.rows[0].metricValues[0].value;
                        const sessions = jsMetrics.rows[0].metricValues[1].value;
                        const screenPageViews = jsMetrics.rows[0].metricValues[2].value;
                        const averageSessionDuration = Number(jsMetrics.rows[0].metricValues[3].value).toFixed(2);
                        const newUsers = jsMetrics.rows[0].metricValues[4].value;
                        const screenPageViewsPerSession = Number(jsMetrics.rows[0].metricValues[5].value).toFixed(2);
                        const engagedSessions = jsMetrics.rows[0].metricValues[6].value;
                        const engagementRate = Number(jsMetrics.rows[0].metricValues[7].value).toFixed(2);
                        const bounceRate = Number(jsMetrics.rows[0].metricValues[8].value).toFixed(2);
                        const userEngagementDuration = jsMetrics.rows[0].metricValues[9].value;

                        // ________________________ PLACES THE RECEIVED VALUES INTO THE CORRESPONDING HTML ELEMENTS ________________________
                        // https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent
                        document.getElementById("activeUsers").textContent = activeUsers;
                        document.getElementById("sessions").textContent = sessions;
                        document.getElementById("screenPageViews").textContent = screenPageViews;
                        document.getElementById("averageSessionDuration").textContent = averageSessionDuration;
                        document.getElementById("newUsers").textContent = newUsers;
                        document.getElementById("screenPageViewsPerSession").textContent = screenPageViewsPerSession;
                        document.getElementById("engagedSessions").textContent = engagedSessions;
                        document.getElementById("engagementRate").textContent = engagementRate;
                        document.getElementById("bounceRate").textContent = bounceRate;
                        document.getElementById("userEngagementDuration").textContent = userEngagementDuration;

                    });        
                    

                    xhr2.addEventListener("load", (event) => {
                        const response2 = xhr2.responseText;
                        // https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/JSON/parse
                        const jsDimensions = JSON.parse(response2);
                        const totalUsers = jsDimensions.rows[0].metricValues[0].value;

                        // https://developer.mozilla.org/en-US/docs/Web/API/Node/textContent
                        document.getElementById("totalUsers").textContent = totalUsers;
                    });

                    // ________________________________________________ SENDS THE REQUESTS ________________________________________________
                    xhr.send(jsonMetrics);
                    xhr2.send(jsonDimensions);

                }
            },
        });

        // ___________________________________________ FUNCTIONS FOR SHOWING AND HIDING THE TABS ___________________________________________
        function showUsersTab() {
            document.getElementById("users_tab").style.display = "block";
            document.getElementById("engagement_tab").style.display = "none";
            document.getElementById("users_tab_button").style.backgroundColor = "#5b7c56";
            document.getElementById("engagement_tab_button").style.backgroundColor = "#6e6e6e";
        }

        function showEngagementTab() {
            document.getElementById("users_tab").style.display = "none";
            document.getElementById("engagement_tab").style.display = "block";
            document.getElementById("users_tab_button").style.backgroundColor = "#6e6e6e";
            document.getElementById("engagement_tab_button").style.backgroundColor = "#5b7c56";
        }

        // ___________________________________________________ SHOW USERS TAB BY DEFAULT ___________________________________________________
        showUsersTab();

        
    </script>

</body>
</html>
