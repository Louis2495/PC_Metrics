<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Challenge Site Metrics</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #FFFFFF;
        }

        .metric_card {
            background-color: #272626;
            border: 1px solid rgb(66, 60, 60);
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            width: 140px;
            height: 140px;
        }

        .cards_row {
            display: flex;
            gap: 20px;
        }


    </style>
</head>




<body>
    <h1>Dashboard</h1>
    <p>Stats gathered from Google Analytics</p>
    
    <div class = "cards_row">
        <div class = "metric_card">
            <h5>Visitors</h5>
            <p>1234</p>
        </div>

        <div class = "metric_card">
            <h5>Sessions</h5>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h5>Page Views</h5>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h5>Avg Session Length</h5>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h5>New Visitors</h5>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h5>Pages per Session</h5>
            <p>1111</p>
        </div>

    </div>
    
</body>
</html>
