<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parents Challenge Site Metrics</title>
    <style>
        .metric_card {
            border: 1px solid black;
            border-radius: 10px;
            padding: 16px;
        }

        .cards_row {
            display: flex;
            gap: 20px;
        }


    </style>
</head>




<body>
    <h1>Dashboard</h1>
    <p>Stats gathered from Google Analytics</p>
    
    <div class = "cards_row">
        <div class = "metric_card">
            <h2>Visitors</h2>
            <p>1234</p>
        </div>

        <div class = "metric_card">
            <h2>Sessions</h2>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h2>Page Views</h2>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h2>Avg Session Length</h2>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h2>New Visitors</h2>
            <p>1111</p>
        </div>

        <div class = "metric_card">
            <h2>Pages per Session</h2>
            <p>1111</p>
        </div>

    </div>
    
</body>
</html>
